<svg xmlns="http://www.w3.org/2000/svg" width="750" height="380" viewBox="0 0 750 380" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="750" height="380" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="749" height="379" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">ARP — Resolving an IP Address to a MAC Address</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">"I know the IP, who owns it? Tell me your MAC."</text>
<rect x="40.0" y="90.0" width="170.0" height="64.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="125.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">Host A</text>
<text x="125.0" y="128.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">192.168.1.10</text>
<text x="125.0" y="144.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">AA:AA:AA:AA:AA:AA</text>
<rect x="290.0" y="90.0" width="170.0" height="64.0" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="375.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">Host B</text>
<text x="375.0" y="128.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">192.168.1.20</text>
<text x="375.0" y="144.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">BB:BB:BB:BB:BB:BB</text>
<rect x="540.0" y="90.0" width="170.0" height="64.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="625.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">Host C</text>
<text x="625.0" y="128.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">192.168.1.30</text>
<text x="625.0" y="144.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">CC:CC:CC:CC:CC:CC</text>
<line x1="40.0" y1="154.0" x2="710.0" y2="154.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="375.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Switch — floods unknown/broadcast frames to every port</text>
<rect x="40.0" y="190.0" width="170.0" height="40.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="125.0" y="206.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="middle" font-weight="bold">1. ARP Request</text>
<text x="125.0" y="221.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">Who has .20?</text>
<line x1="210.0" y1="210.0" x2="290.0" y2="210.0" stroke="#4f46e5" stroke-width="1.5"/>
<path d="M 290.0,210.0 L 283.9,213.5 L 283.9,206.5 Z" fill="#4f46e5"/>
<text x="250.0" y="214.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">broadcast</text>
<line x1="210.0" y1="210.0" x2="540.0" y2="210.0" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 540.0,210.0 L 533.9,213.5 L 533.9,206.5 Z" fill="#4f46e5"/>
<text x="375.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Destination MAC = FF:FF:FF:FF:FF:FF  (everyone listens)</text>
<line x1="460.0" y1="272.0" x2="210.0" y2="272.0" stroke="#16a34a" stroke-width="1.6"/>
<path d="M 210.0,272.0 L 216.9,268.0 L 216.9,276.0 Z" fill="#16a34a"/>
<text x="335.0" y="264.1" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">2. ARP Reply (unicast)</text>
<text x="375.0" y="292.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">"192.168.1.20 is at BB:BB:BB:BB:BB:BB"</text>
<rect x="30.0" y="310.0" width="690.0" height="54.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="46.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Result: Host A stores the mapping in its ARP cache (TTL ~2-20 min) and can now build the Layer-2 frame.</text>
<text x="46.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Off-subnet? Host A never ARPs for the far-away host — it ARPs for its DEFAULT GATEWAY. IPv6 replaces ARP with NDP</text>
<text x="46.0" y="360.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">(ICMPv6).</text>
</svg>
