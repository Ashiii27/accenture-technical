<text x="520.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Rules: drop constants (3n → O(n)), keep the dominant term (n² + n →</text>
<text x="520.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">O(n²)), and different inputs get different letters (O(a + b)).</text>
<text x="30.0" y="408.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Exam favourite: a loop that halves the problem each pass is O(log n); nested loops over the same data are O(n²); a loop whose inner work halves each pass</text>
<text x="30.0" y="423.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">is O(n), not O(n log n).</text>
