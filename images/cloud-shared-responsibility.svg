<text x="46.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">IaaS = VMs / networks / storage (EC2, Azure VM) — YOU patch the guest OS. PaaS = runtime + middleware managed (App Service,</text>
<text x="46.0" y="459.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">RDS) — you deploy code only.</text>
<text x="46.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">SaaS = ready-to-use software (Gmail, Salesforce). Serverless/FaaS = pay per execution. Never shared: your DATA and who may access</text>
