<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="780" height="380" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="779" height="379" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Encryption &amp; Hashing — Three Different Tools</text>
<rect x="30.0" y="76.0" width="240.0" height="250.0" rx="7" fill="#4f46e514" stroke="#4f46e5" stroke-width="1.4"/>
<rect x="85.0" y="88.0" width="130.0" height="28.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="150.0" y="106.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">SYMMETRIC</text>
<text x="44.0" y="148.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Plaintext ──[ same secret key ]──▶</text>
<text x="44.0" y="163.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Ciphertext</text>
<text x="44.0" y="190.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Ciphertext ──[ same secret key ]──▶</text>
<text x="44.0" y="205.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Plaintext</text>
<text x="44.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Fast • one shared key • key</text>
<text x="44.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">distribution is the problem</text>
<text x="44.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">AES, DES/3DES, RC4, ChaCha20</text>
<rect x="280.0" y="76.0" width="240.0" height="250.0" rx="7" fill="#0d948814" stroke="#0d9488" stroke-width="1.4"/>
<rect x="335.0" y="88.0" width="130.0" height="28.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
<text x="400.0" y="106.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">ASYMMETRIC</text>
<text x="294.0" y="148.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Plaintext ──[ PUBLIC key ]──▶</text>
<text x="294.0" y="163.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Ciphertext</text>
<text x="294.0" y="190.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Ciphertext ──[ PRIVATE key ]──▶</text>
<text x="294.0" y="205.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Plaintext</text>
<text x="294.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Slow • solves key exchange • ~100–1000×</text>
<text x="294.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">slower</text>
<text x="294.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">RSA, ECC, Diffie–Hellman</text>
<rect x="530.0" y="76.0" width="240.0" height="250.0" rx="7" fill="#d9770614" stroke="#d97706" stroke-width="1.4"/>
<rect x="585.0" y="88.0" width="130.0" height="28.0" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="650.0" y="106.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">HASHING</text>
<text x="544.0" y="148.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Message ──[ hash function ]──▶</text>
<text x="544.0" y="163.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">fixed-length digest</text>
<text x="544.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">One-way only — there is NO key that</text>
<text x="544.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">reverses it</text>
<text x="544.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Integrity • password storage (salted!)</text>
<text x="544.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">• signatures</text>
<text x="544.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">MD5 (broken), SHA-1 (broken), SHA-256,</text>
<text x="544.0" y="289.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">bcrypt</text>
<rect x="30.0" y="336.0" width="720.0" height="34.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="46.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Digital signature = hash the message, encrypt the hash with the signer private key — gives integrity + authenticity +</text>
<text x="46.0" y="367.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">non-repudiation (anyone can verify with the public key).</text>
</svg>
