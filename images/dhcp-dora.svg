<svg xmlns="http://www.w3.org/2000/svg" width="750" height="400" viewBox="0 0 750 400" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="750" height="400" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="749" height="399" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">DHCP — The DORA Exchange (UDP 67 server / 68 client)</text>
<rect x="60.0" y="80.0" width="160.0" height="44.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="140.0" y="106.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">Client  (0.0.0.0)</text>
<rect x="500.0" y="80.0" width="180.0" height="44.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="590.0" y="106.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">DHCP Server</text>
<line x1="140.0" y1="124.0" x2="140.0" y2="300.0" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="590.0" y1="124.0" x2="590.0" y2="300.0" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="140.0" y1="150.0" x2="590.0" y2="150.0" stroke="#4f46e5" stroke-width="1.5"/>
<path d="M 590.0,150.0 L 583.9,153.5 L 583.9,146.5 Z" fill="#4f46e5"/>
<text x="365.0" y="143.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#4f46e5" text-anchor="middle" font-weight="bold">1. DISCOVER   (broadcast →)</text>
<text x="365.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Client has no IP yet: "Is there a DHCP server?"</text>
<line x1="590.0" y1="192.0" x2="140.0" y2="192.0" stroke="#0d9488" stroke-width="1.5"/>
<path d="M 140.0,192.0 L 146.1,188.5 L 146.1,195.5 Z" fill="#0d9488"/>
<text x="365.0" y="185.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#0d9488" text-anchor="middle" font-weight="bold">2. OFFER   (← unicast/broadcast)</text>
<text x="365.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Server offers an IP + mask + lease</text>
<line x1="140.0" y1="234.0" x2="590.0" y2="234.0" stroke="#4f46e5" stroke-width="1.5"/>
<path d="M 590.0,234.0 L 583.9,237.5 L 583.9,230.5 Z" fill="#4f46e5"/>
<text x="365.0" y="227.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#4f46e5" text-anchor="middle" font-weight="bold">3. REQUEST   (broadcast →)</text>
<text x="365.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Client formally asks for the offered IP</text>
<line x1="590.0" y1="276.0" x2="140.0" y2="276.0" stroke="#0d9488" stroke-width="1.5"/>
<path d="M 140.0,276.0 L 146.1,272.5 L 146.1,279.5 Z" fill="#0d9488"/>
<text x="365.0" y="269.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#0d9488" text-anchor="middle" font-weight="bold">4. ACKNOWLEDGE   (← unicast/broadcast)</text>
<text x="365.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Server confirms; client configures itself</text>
<rect x="30.0" y="322.0" width="690.0" height="62.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="46.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#d97706" text-anchor="start" font-weight="bold">What the ACK carries</text>
<text x="46.0" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">IP address • subnet mask • default gateway • DNS server(s) • lease time • (optionally NTP, domain name)</text>
<text x="46.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">No DHCP server reachable? Windows/Linux self-assign an APIPA address from 169.254.0.0/16 — you get link-local connectivity</text>
<text x="46.0" y="394.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">only.</text>
</svg>
