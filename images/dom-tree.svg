<text x="46.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="bold">The five DOM moves you must know for the coding round</text>
<text x="46.0" y="344.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="start" font-weight="bold">document.getElementById('btn')</text>
<text x="46.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b7280" text-anchor="start" font-weight="normal">find ONE element by id</text>
<text x="296.0" y="344.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="start" font-weight="bold">document.querySelector('.msg')</text>
<text x="296.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b7280" text-anchor="start" font-weight="normal">first match for ANY CSS selector</text>
<text x="546.0" y="344.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="start" font-weight="bold">document.querySelectorAll('.msg')</text>
<text x="546.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b7280" text-anchor="start" font-weight="normal">ALL matches (NodeList — has forEach)</text>
<text x="46.0" y="374.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="start" font-weight="bold">el.textContent = 'New text'</text>
<text x="46.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b7280" text-anchor="start" font-weight="normal">change the visible text (safe)</text>
<text x="296.0" y="374.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="start" font-weight="bold">el.addEventListener('click', fn)</text>
<text x="296.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b7280" text-anchor="start" font-weight="normal">run fn when the element is clicked</text>
<text x="546.0" y="374.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="start" font-weight="bold">el.classList.toggle('active')</text>
<text x="546.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#6b7280" text-anchor="start" font-weight="normal">add/remove a CSS class</text>
