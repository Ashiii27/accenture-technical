<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="759" height="419" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Excel Cell References — What Happens When You Copy a Formula</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">Formula typed in B2, then copied to C3 (one column right, one row down)</text>
<rect x="30.0" y="84.0" width="180.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="120.0" y="102.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="bold">Reference type</text>
<rect x="220.0" y="84.0" width="130.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="285.0" y="102.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="bold">Written in B2</text>
<rect x="360.0" y="84.0" width="170.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="445.0" y="102.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="bold">After copy to C3</text>
<rect x="540.0" y="84.0" width="200.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="640.0" y="102.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="bold">What is locked?</text>
<rect x="30.0" y="114.0" width="180.0" height="36.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="40.0" y="137.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">Relative</text>
<rect x="220.0" y="114.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="240.0" y="138.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=A1</text>
<line x1="356.0" y1="132.0" x2="400.0" y2="132.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 400.0,132.0 L 394.8,135.0 L 394.8,129.0 Z" fill="#4f46e5"/>
<rect x="400.0" y="114.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="420.0" y="138.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=B2</text>
<rect x="540.0" y="114.0" width="200.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="550.0" y="137.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">nothing — both move</text>
<rect x="30.0" y="154.0" width="180.0" height="36.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="40.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">Absolute</text>
<rect x="220.0" y="154.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="240.0" y="178.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=$A$1</text>
<line x1="356.0" y1="172.0" x2="400.0" y2="172.0" stroke="#0d9488" stroke-width="1.4"/>
<path d="M 400.0,172.0 L 394.8,175.0 L 394.8,169.0 Z" fill="#0d9488"/>
<rect x="400.0" y="154.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="420.0" y="178.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=$A$1</text>
<rect x="540.0" y="154.0" width="200.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="550.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">column AND row</text>
<rect x="30.0" y="194.0" width="180.0" height="36.0" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="40.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">Mixed (col locked)</text>
<rect x="220.0" y="194.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="240.0" y="218.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=$A1</text>
<line x1="356.0" y1="212.0" x2="400.0" y2="212.0" stroke="#d97706" stroke-width="1.4"/>
<path d="M 400.0,212.0 L 394.8,215.0 L 394.8,209.0 Z" fill="#d97706"/>
<rect x="400.0" y="194.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="420.0" y="218.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=$A2</text>
<rect x="540.0" y="194.0" width="200.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="550.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">column only — row moves</text>
<rect x="30.0" y="234.0" width="180.0" height="36.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="40.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">Mixed (row locked)</text>
<rect x="220.0" y="234.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="240.0" y="258.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=A$1</text>
<line x1="356.0" y1="252.0" x2="400.0" y2="252.0" stroke="#7c3aed" stroke-width="1.4"/>
<path d="M 400.0,252.0 L 394.8,255.0 L 394.8,249.0 Z" fill="#7c3aed"/>
<rect x="400.0" y="234.0" width="130.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="420.0" y="258.0" font-family="Courier New, Courier, monospace" font-size="11.5" fill="#111827" text-anchor="start" font-weight="bold">=B$1</text>
<rect x="540.0" y="234.0" width="200.0" height="36.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="550.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">row only — column moves</text>
<rect x="30.0" y="292.0" width="700.0" height="74.0" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="46.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">Rule: the $ sits in FRONT of the part you want to freeze — $A1 freezes the column, A$1 freezes the row, $A$1</text>
<text x="46.0" y="329.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">freezes both.</text>
<text x="46.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">F4 cycles A1 → $A$1 → A$1 → $A1 → A1. Copy across copies the column letter; copy down copies the row number.</text>
<rect x="30.0" y="358.0" width="700.0" height="50.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="46.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold">Exam trap</text>
<text x="46.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">=$A4+B$2 in C4 copied to D5 becomes =$A5+C$2 — the column-absolute part keeps its letter, the row-absolute part keeps</text>
<text x="46.0" y="411.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">its number.</text>
</svg>
