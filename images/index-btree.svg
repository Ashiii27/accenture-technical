<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="799" height="399" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Indexes — B-Tree Lookups and Clustered vs Non-Clustered</text>
<rect x="30.0" y="78.0" width="360.0" height="150.0" rx="6" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">B-tree index on salary</text>
<rect x="150.0" y="112.0" width="120.0" height="30.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="210.0" y="130.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">root: [ 30 | 60 ]</text>
<line x1="180.0" y1="142.0" x2="90.0" y2="168.0" stroke="#475569" stroke-width="1.2"/>
<path d="M 90.0,168.0 L 94.2,163.7 L 95.8,169.4 Z" fill="#475569"/>
<line x1="210.0" y1="142.0" x2="210.0" y2="168.0" stroke="#475569" stroke-width="1.2"/>
<path d="M 210.0,168.0 L 207.0,162.8 L 213.0,162.8 Z" fill="#475569"/>
<line x1="240.0" y1="142.0" x2="330.0" y2="168.0" stroke="#475569" stroke-width="1.2"/>
<path d="M 330.0,168.0 L 324.2,169.4 L 325.8,163.7 Z" fill="#475569"/>
<rect x="50.0" y="170.0" width="96.0" height="30.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="98.0" y="188.4" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">[10 20]</text>
<rect x="160.0" y="170.0" width="96.0" height="30.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="208.0" y="188.4" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">[30 40 50]</text>
<rect x="270.0" y="170.0" width="96.0" height="30.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="318.0" y="188.4" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">[60 70 80]</text>
<line x1="50.0" y1="200.0" x2="356.0" y2="200.0" stroke="#94a3b8" stroke-width="1"/>
<text x="46.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Balanced tree → lookups, ranges and sorts are O(log n) instead</text>
<text x="46.0" y="230.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">of a full O(n) table scan.</text>
<rect x="410.0" y="78.0" width="360.0" height="150.0" rx="6" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="426.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0d9488" text-anchor="start" font-weight="bold">CLUSTERED index (one per table)</text>
<rect x="426.0" y="112.0" width="250.0" height="22.0" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
<text x="434.0" y="128.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">id 10  Ravi</text>
<rect x="426.0" y="138.0" width="250.0" height="22.0" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
<text x="434.0" y="154.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">id 20  Anu</text>
<rect x="426.0" y="164.0" width="250.0" height="22.0" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
<text x="434.0" y="180.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">id 30  Kabir</text>
<text x="426.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">The ROWS themselves are stored in key order — that is why</text>
<text x="426.0" y="214.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">there can be only one.</text>
<rect x="410.0" y="244.0" width="360.0" height="122.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="426.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#d97706" text-anchor="start" font-weight="bold">NON-CLUSTERED index (many allowed)</text>
<rect x="426.0" y="280.0" width="120.0" height="20.0" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
<text x="434.0" y="294.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">Anu → row 2</text>
<rect x="426.0" y="304.0" width="120.0" height="20.0" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
<text x="434.0" y="318.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">Kabir → row 3</text>
<rect x="426.0" y="328.0" width="120.0" height="20.0" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
<text x="434.0" y="342.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">Ravi → row 1</text>
<text x="426.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">A separate sorted structure that points back at the rows; the</text>
<text x="426.0" y="370.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">engine does one extra lookup.</text>
<rect x="30.0" y="244.0" width="360.0" height="122.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="46.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold">The trade-off examiners love</text>
<text x="46.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Indexes speed up reads (WHERE, JOIN, ORDER BY) but slow</text>
<text x="46.0" y="299.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">down writes: every INSERT/UPDATE/DELETE must also update</text>
<text x="46.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">the index.</text>
<text x="46.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">They also do not help when a query must read most of the table</text>
<text x="46.0" y="344.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">— the planner then prefers a full scan.</text>
</svg>
