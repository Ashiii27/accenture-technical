<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="920" height="430" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="919" height="429" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Java Exception Hierarchy</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">What you must catch, what you may ignore, and what you should never catch</text>
<rect x="370.0" y="95.0" width="180.0" height="44.0" rx="7" fill="#475569" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="121.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">Throwable</text>
<rect x="150.0" y="210.0" width="200.0" height="44.0" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="250.0" y="236.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">Error</text>
<text x="165.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">StackOverflowError, OutOfMemoryError</text>
<rect x="570.0" y="210.0" width="200.0" height="44.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="670.0" y="236.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">Exception</text>
<rect x="380.0" y="315.0" width="240.0" height="60.0" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="395.0" y="335.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#d97706" text-anchor="start" font-weight="bold">RuntimeException — UNCHECKED</text>
<text x="395.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal">NPE, ArrayIndexOutOfBounds,</text>
<text x="395.0" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal">ArithmeticException — no throws needed</text>
<rect x="660.0" y="315.0" width="220.0" height="60.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="675.0" y="335.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0d9488" text-anchor="start" font-weight="bold">Checked exceptions</text>
<text x="675.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal">IOException, SQLException —</text>
<text x="675.0" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal">must be caught or declared</text>
<line x1="420.0" y1="139.0" x2="250.0" y2="210.0" stroke="#475569" stroke-width="1.4"/>
<path d="M 250.0,210.0 L 254.2,204.4 L 256.9,210.9 Z" fill="#475569"/>
<line x1="500.0" y1="139.0" x2="670.0" y2="210.0" stroke="#475569" stroke-width="1.4"/>
<path d="M 670.0,210.0 L 663.1,210.9 L 665.8,204.4 Z" fill="#475569"/>
<line x1="620.0" y1="254.0" x2="500.0" y2="315.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 500.0,315.0 L 503.8,309.1 L 507.0,315.4 Z" fill="#4f46e5"/>
<line x1="720.0" y1="254.0" x2="770.0" y2="315.0" stroke="#0d9488" stroke-width="1.4"/>
<path d="M 770.0,315.0 L 763.5,312.5 L 768.9,308.1 Z" fill="#0d9488"/>
<text x="40.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Errors are JVM-level catastrophes — never</text>
<text x="40.0" y="114.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">catch them.</text>
<rect x="40.0" y="395.0" width="850.0" height="30.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="54.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">catch (Exception e) handles everything under Exception; throws declares it; finally always runs.</text>
</svg>
