<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="920" height="400" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="919" height="399" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Java Strings — the Pool vs the Heap</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Literals are pooled; new String() always makes a fresh object</text>
<rect x="40.0" y="95.0" width="420.0" height="250.0" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="56.0" y="125.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">String a = "abc";   // pooled</text>
<text x="56.0" y="151.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">String b = "abc";   // reuses pool</text>
<text x="56.0" y="177.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">String c = new String("abc"); // heap</text>
<text x="56.0" y="203.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal"> </text>
<text x="56.0" y="229.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">a == b      → true</text>
<text x="56.0" y="255.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">a == c      → false</text>
<text x="56.0" y="281.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">a.equals(c) → true</text>
<text x="56.0" y="307.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">c.equals(a) → true</text>
<rect x="560.0" y="100.0" width="320.0" height="100.0" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="575.0" y="122.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="bold">STRING POOL</text>
<rect x="640.0" y="145.0" width="160.0" height="36.0" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="720.0" y="167.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">"abc"</text>
<rect x="560.0" y="240.0" width="320.0" height="100.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="575.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4f46e5" text-anchor="start" font-weight="bold">HEAP (regular objects)</text>
<rect x="640.0" y="285.0" width="160.0" height="36.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="720.0" y="307.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">"abc" (c)</text>
<line x1="460.0" y1="180.0" x2="636.0" y2="163.0" stroke="#16a34a" stroke-width="1.4"/>
<path d="M 636.0,163.0 L 630.3,167.1 L 629.6,160.1 Z" fill="#16a34a"/>
<text x="548.6" y="175.6" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">a, b</text>
<line x1="460.0" y1="240.0" x2="636.0" y2="303.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 636.0,303.0 L 629.1,304.3 L 631.5,297.7 Z" fill="#4f46e5"/>
<text x="546.0" y="275.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">c</text>
<rect x="40.0" y="360.0" width="850.0" height="30.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="54.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">Use .equals() to compare String CONTENTS; == compares REFERENCES. Pooling saves memory for repeated literals.</text>
</svg>
