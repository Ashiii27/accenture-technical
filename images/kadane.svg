<text x="449.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">5</text>
<rect x="482.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#0d948822" stroke="#0d9488" stroke-width="1"/>
<text x="511.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">6</text>
<rect x="544.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
