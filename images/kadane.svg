<rect x="606.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="635.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">6</text>
<text x="110.0" y="214.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">max_ending_here = max(a[i], max_ending_here + a[i])</text>
<text x="110.0" y="232.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">max_so_far = max(max_so_far, max_ending_here)</text>
<rect x="30.0" y="250.0" width="740.0" height="122.0" rx="6" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">Why it works</text>
<text x="46.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Any maximum subarray ending at i either (a) is just a[i], or (b) is the best subarray ending at i-1 plus a[i]. Keeping both</text>
<text x="46.0" y="307.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">running values gives the answer in ONE pass: O(n) time, O(1) space.</text>
<text x="46.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Here the best window is indices 3..6 → 4 + (−1) + 2 + 1 = 6. With all-negative input, the answer is the single largest</text>
<text x="46.0" y="347.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">element — never 0 unless you decide an empty subarray is allowed.</text>
</svg>
