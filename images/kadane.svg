<text x="30.0" y="186.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#0d9488" text-anchor="start" font-weight="bold">max_so_far</text>
<rect x="110.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="139.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">-2</text>
<rect x="172.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="201.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">1</text>
<rect x="234.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="263.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">1</text>
<rect x="296.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#0d948822" stroke="#0d9488" stroke-width="1"/>
<text x="325.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">4</text>
<rect x="358.0" y="162.0" width="58.0" height="34.0" rx="7" fill="#0d948822" stroke="#0d9488" stroke-width="1"/>
