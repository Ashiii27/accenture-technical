<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="779" height="399" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">DBMS Keys — How They Nest Inside Each Other</text>
<ellipse cx="220" cy="200" rx="170" ry="130" fill="#f1f5f9" stroke="#475569"/>
<text x="68.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">SUPERKEY</text>
<text x="68.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">any set of columns that uniquely identifies a row</text>
<ellipse cx="220" cy="216" rx="130" ry="92" fill="#eef2ff" stroke="#4f46e5"/>
<text x="104.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4f46e5" text-anchor="start" font-weight="bold">CANDIDATE KEY</text>
<text x="104.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">minimal superkey — no subset of it is unique</text>
<ellipse cx="220" cy="236" rx="88" ry="56" fill="#ecfdf5" stroke="#0d9488"/>
<text x="220.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="bold">PRIMARY KEY</text>
<text x="220.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111827" text-anchor="middle" font-weight="normal">the one you chose</text>
<text x="220.0" y="258.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="middle" font-weight="normal">NOT NULL + UNIQUE</text>
<rect x="470.0" y="120.0" width="280.0" height="44.0" rx="6" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.2"/>
<text x="486.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="bold">ALTERNATE KEY</text>
<text x="486.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">candidate keys not chosen as PK</text>
<rect x="470.0" y="178.0" width="280.0" height="44.0" rx="6" fill="#d9770614" stroke="#d97706" stroke-width="1.2"/>
<text x="486.0" y="198.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="bold">COMPOSITE KEY</text>
<text x="486.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">two or more columns together</text>
<rect x="470.0" y="236.0" width="280.0" height="44.0" rx="6" fill="#47556914" stroke="#475569" stroke-width="1.2"/>
<text x="486.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="bold">SURROGATE KEY</text>
<text x="486.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">artificial id (auto-increment)</text>
<rect x="30.0" y="320.0" width="720.0" height="66.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="46.0" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="bold">FOREIGN KEY</text>
<text x="46.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">A column (or set) in the CHILD table that points at the PRIMARY KEY of the PARENT table.</text>
<text x="46.0" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">employees.dept_id → departments.dept_id. NULL is allowed when the column is nullable, but any non-NULL value MUST exist in the</text>
<text x="46.0" y="390.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">parent.</text>
</svg>
