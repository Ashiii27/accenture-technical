<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="919" height="469" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Inheritance — the IS-A Relationship</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">A child class reuses the parent’s fields and methods, then adds its own</text>
<rect x="250.0" y="95.0" width="220.0" height="30.0" rx="7" fill="#475569" stroke="#475569" stroke-width="1.2"/>
<text x="360.0" y="114.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">class Animal</text>
<rect x="250.0" y="125.0" width="220.0" height="74.0" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="262.0" y="148.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">+ name : String</text>
<text x="262.0" y="166.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="normal">+ eat()</text>
<text x="262.0" y="184.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="normal">+ sleep()</text>
<rect x="60.0" y="260.0" width="200.0" height="30.0" rx="7" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.2"/>
<text x="160.0" y="279.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">class Dog</text>
<rect x="60.0" y="290.0" width="200.0" height="44.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="72.0" y="318.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">+ bark()   (added)</text>
<rect x="400.0" y="260.0" width="200.0" height="30.0" rx="7" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.2"/>
<text x="500.0" y="279.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">class Cat</text>
<rect x="400.0" y="290.0" width="200.0" height="44.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="412.0" y="318.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">+ meow()   (added)</text>
<line x1="160.0" y1="260.0" x2="320.0" y2="199.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 320.0,199.0 L 315.6,204.4 L 313.1,197.9 Z" fill="#4f46e5"/>
<text x="242.1" y="233.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">IS-A</text>
<line x1="500.0" y1="260.0" x2="400.0" y2="199.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 400.0,199.0 L 407.0,199.2 L 403.4,205.1 Z" fill="#4f46e5"/>
<text x="453.1" y="222.5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">IS-A</text>
<rect x="660.0" y="95.0" width="230.0" height="299.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="674.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#7c3aed" text-anchor="start" font-weight="bold">What a child class gets</text>
<text x="674.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✓ Inherits: parent fields</text>
<text x="674.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✓   + methods (reuse)</text>
<text x="674.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✓ Adds its own new</text>
<text x="674.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✓   fields + methods</text>
<text x="674.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✓ Overrides a parent</text>
<text x="674.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✓   method with its own</text>
<text x="674.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✗ Private members are</text>
<text x="674.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✗   NOT directly reachable</text>
<text x="674.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✗ Constructors are NOT</text>
<text x="674.0" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">✗   inherited</text>
<rect x="40.0" y="410.0" width="850.0" height="42.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="54.0" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">Dog IS-A Animal  •  Cat IS-A Animal — every Dog can eat() and sleep() without rewriting that code.</text>
</svg>
