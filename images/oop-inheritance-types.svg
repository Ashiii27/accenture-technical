<text x="54.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">The diamond problem: with multiple inheritance D would inherit TWO copies of A’s members — which one wins is ambiguous. Java and C# ban class</text>
