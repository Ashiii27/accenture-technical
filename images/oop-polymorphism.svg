<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="919" height="469" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Polymorphism — One Interface, Many Behaviours</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Compile-time (overloading) decides by signature; runtime (overriding) decides by object type</text>
<rect x="40.0" y="88.0" width="400.0" height="32.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="240.0" y="107.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="bold">COMPILE-TIME — method overloading</text>
<rect x="60.0" y="160.0" width="150.0" height="44.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="135.0" y="186.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">add(a, b)</text>
<rect x="310.0" y="140.0" width="120.0" height="40.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="370.0" y="163.4" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">add(int, int)</text>
<rect x="310.0" y="196.0" width="120.0" height="40.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="370.0" y="219.4" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">add(double, double)</text>
<rect x="310.0" y="252.0" width="120.0" height="40.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="370.0" y="275.4" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="middle" font-weight="normal">add(String, String)</text>
<line x1="210.0" y1="172.0" x2="310.0" y2="160.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 310.0,160.0 L 304.4,164.2 L 303.6,157.2 Z" fill="#4f46e5"/>
<text x="260.7" y="170.1" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">int, int</text>
<line x1="210.0" y1="182.0" x2="310.0" y2="216.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 310.0,216.0 L 303.1,217.4 L 305.4,210.7 Z" fill="#4f46e5"/>
<text x="258.1" y="202.8" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">double, double</text>
<line x1="210.0" y1="192.0" x2="310.0" y2="272.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 310.0,272.0 L 303.1,270.9 L 307.5,265.5 Z" fill="#4f46e5"/>
<text x="256.3" y="234.8" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">String, String</text>
<text x="50.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">The compiler picks the matching version by the ARGUMENT TYPES —</text>
<text x="50.0" y="344.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">decided before the program even runs.</text>
<rect x="480.0" y="88.0" width="400.0" height="32.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="680.0" y="107.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="bold">RUNTIME — method overriding</text>
<rect x="520.0" y="150.0" width="148.3" height="20.0" rx="10.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
<text x="594.1" y="163.8" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal">Animal a = new Dog();</text>
<rect x="520.0" y="210.0" width="150.0" height="44.0" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="595.0" y="236.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">a.sound()</text>
<rect x="740.0" y="210.0" width="140.0" height="44.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="810.0" y="235.6" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="middle" font-weight="bold">which sound()?</text>
<rect x="500.0" y="330.0" width="180.0" height="44.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="590.0" y="355.6" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">Dog.sound() → woof</text>
<rect x="700.0" y="330.0" width="180.0" height="44.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="790.0" y="355.6" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">Cat.sound() → meow</text>
<line x1="740.0" y1="254.0" x2="590.0" y2="330.0" stroke="#7c3aed" stroke-width="1.4"/>
<path d="M 590.0,330.0 L 593.8,324.1 L 597.0,330.4 Z" fill="#7c3aed"/>
<text x="662.3" y="284.7" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">object is a Dog</text>
<line x1="790.0" y1="254.0" x2="790.0" y2="330.0" stroke="#7c3aed" stroke-width="1.4"/>
<path d="M 790.0,330.0 L 786.5,323.9 L 793.5,323.9 Z" fill="#7c3aed"/>
<text x="796.0" y="295.3" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal">object is a Cat</text>
<text x="490.0" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">The runtime looks at the ACTUAL object type (Dog), not the reference</text>
<text x="490.0" y="412.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">type (Animal).</text>
<rect x="40.0" y="424.0" width="840.0" height="34.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="54.0" y="445.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">Overloading = same name, DIFFERENT parameters, ONE class.   Overriding = SAME signature, child redefines, TWO classes.</text>
</svg>
