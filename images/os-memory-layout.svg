<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="920" height="440" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="919" height="439" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">A Process in Memory — Virtual Address Space</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Each process gets its own virtual address space, mapped to physical RAM by the MMU</text>
<rect x="200.0" y="100.0" width="320.0" height="60.0" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="360.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4f46e5" text-anchor="middle" font-weight="bold">STACK</text>
<text x="360.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">locals, parameters, return addresses — grows down</text>
<rect x="200.0" y="175.0" width="320.0" height="60.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="360.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="bold">HEAP</text>
<text x="360.0" y="221.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">objects &amp; dynamic memory (new / malloc) — grows up</text>
<rect x="200.0" y="250.0" width="320.0" height="60.0" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="360.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="bold">DATA / BSS</text>
<text x="360.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">global and static variables</text>
<rect x="200.0" y="325.0" width="320.0" height="60.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="360.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="bold">TEXT (CODE)</text>
<text x="360.0" y="371.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">executable instructions — read-only</text>
<line x1="600.0" y1="380.0" x2="600.0" y2="100.0" stroke="#475569" stroke-width="1.4"/>
<path d="M 600.0,100.0 L 603.5,106.1 L 596.5,106.1 Z" fill="#475569"/>
<text x="600.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">higher addresses</text>
<text x="612.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">lower addresses</text>
<text x="640.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Stack: auto cleanup on return — fast,</text>
<text x="640.0" y="134.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">fixed-size frames.</text>
<text x="640.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Heap: programmer-managed (or GC’d); shared</text>
<text x="640.0" y="179.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">across threads.</text>
<text x="640.0" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Fragmentation: paging (fixed-size frames)</text>
<text x="640.0" y="239.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">avoids external fragmentation.</text>
<text x="640.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Page fault: accessing a page not in RAM — the</text>
<text x="640.0" y="299.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">OS fetches it from disk (swap).</text>
<rect x="40.0" y="400.0" width="850.0" height="30.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="54.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">One process cannot read another process’s heap — the OS enforces the boundary.</text>
</svg>
