<text x="420.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal">IP, ICMP, OSPF, BGP, ARP</text>
<text x="676.0" y="317.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold">Router</text>
