<text x="420.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal">Cables, hubs, signals, 802.11</text>
<text x="676.0" y="417.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold">Hub</text>
<text x="30.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Layer 1–2 = hardware/media layers  •  Layer 3–4 = addressing &amp; delivery  •  Layer 5–7 = application-facing</text>
<text x="30.0" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Trap: TLS is described as sitting BETWEEN the Transport and Application layers (it protects L4–L7 traffic).</text>
