<text x="82.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Physical</text>
<text x="82.0" y="426.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Bits</text>
