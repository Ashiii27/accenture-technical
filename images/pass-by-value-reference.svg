<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="779" height="399" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Pass by Value vs Pass by Reference — What the Callee Can Change</text>
<rect x="30.0" y="78.0" width="350.0" height="250.0" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="205.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4f46e5" text-anchor="middle" font-weight="bold">PASS BY VALUE</text>
<text x="50.0" y="126.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">main():  x = 5</text>
<rect x="50.0" y="138.0" width="120.0" height="44.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="110.0" y="156.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">x</text>
<text x="110.0" y="172.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">5</text>
<line x1="170.0" y1="160.0" x2="250.0" y2="160.0" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M 250.0,160.0 L 243.9,163.5 L 243.9,156.5 Z" fill="#4f46e5"/>
<text x="210.0" y="164.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">copy of the value</text>
<rect x="250.0" y="138.0" width="110.0" height="44.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="305.0" y="156.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="bold">param a</text>
<text x="305.0" y="172.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">5 → 15</text>
<text x="50.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Inside the function a = a + 10 changes only the COPY.</text>
<text x="50.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Back in main, x is still 5.</text>
<text x="50.0" y="306.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#4f46e5" text-anchor="start" font-weight="bold">Result: PRINT x  →  5</text>
<rect x="400.0" y="78.0" width="350.0" height="250.0" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.4"/>
<text x="575.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="bold">PASS BY REFERENCE</text>
<text x="420.0" y="126.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">main():  y = 5</text>
<rect x="420.0" y="138.0" width="120.0" height="44.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
<text x="480.0" y="156.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">y</text>
<text x="480.0" y="172.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">5 → 15</text>
<line x1="540.0" y1="160.0" x2="620.0" y2="160.0" stroke="#0d9488" stroke-width="1.4"/>
<path d="M 620.0,160.0 L 613.9,163.5 L 613.9,156.5 Z" fill="#0d9488"/>
<text x="580.0" y="164.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">same memory</text>
<rect x="620.0" y="138.0" width="110.0" height="44.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="675.0" y="156.0" font-family="Courier New, Courier, monospace" font-size="10" fill="#111827" text-anchor="middle" font-weight="bold">param b</text>
<text x="675.0" y="172.0" font-family="Courier New, Courier, monospace" font-size="9" fill="#111827" text-anchor="middle" font-weight="normal">alias of y</text>
<text x="420.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">The parameter is another name for the SAME box. b = b +</text>
<text x="420.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">10 writes straight into the caller variable.</text>
<text x="420.0" y="306.0" font-family="Courier New, Courier, monospace" font-size="11" fill="#0d9488" text-anchor="start" font-weight="bold">Result: PRINT y  →  15</text>
<rect x="30.0" y="342.0" width="720.0" height="46.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="46.0" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold">In most exam pseudocode, plain variables are passed BY VALUE and ARRAYS are passed BY REFERENCE.</text>
<text x="46.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">So a function that edits arr[i] does change the caller array — a function that swaps two plain variables does nothing.</text>
</svg>
