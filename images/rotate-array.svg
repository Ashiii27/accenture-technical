<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="780" height="380" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="779" height="379" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Rotate an Array Right by k — The Reversal Trick (O(1) extra space)</text>
<text x="30.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">Example: [1,2,3,4,5,6,7], k = 3</text>
<text x="30.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="bold">start   [1, 2, 3, 4, 5, 6 7]   with k = 3</text>
<rect x="60.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="86.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">1</text>
<rect x="116.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="142.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">2</text>
<rect x="172.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="198.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">3</text>
<rect x="228.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="254.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">4</text>
<rect x="284.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="310.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">5</text>
<rect x="340.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="366.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">6</text>
<rect x="396.0" y="84.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="422.0" y="109.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">7</text>
<line x1="462.0" y1="130.0" x2="462.0" y2="148.0" stroke="#475569" stroke-width="1.3"/>
<path d="M 462.0,148.0 L 458.5,141.9 L 465.5,141.9 Z" fill="#475569"/>
<text x="30.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="bold">1. reverse the whole array</text>
<rect x="60.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="86.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">7</text>
<rect x="116.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="142.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">6</text>
<rect x="172.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="198.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">5</text>
<rect x="228.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="254.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">4</text>
<rect x="284.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="310.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">3</text>
<rect x="340.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="366.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">2</text>
<rect x="396.0" y="152.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="422.0" y="177.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">1</text>
<line x1="462.0" y1="198.0" x2="462.0" y2="216.0" stroke="#475569" stroke-width="1.3"/>
<path d="M 462.0,216.0 L 458.5,209.9 L 465.5,209.9 Z" fill="#475569"/>
<text x="30.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="bold">2. reverse the first k = 3</text>
<rect x="60.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="86.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">5</text>
<rect x="116.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="142.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">6</text>
<rect x="172.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="198.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">7</text>
<rect x="228.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="254.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">4</text>
<rect x="284.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="310.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">3</text>
<rect x="340.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="366.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">2</text>
<rect x="396.0" y="220.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="422.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">1</text>
<line x1="462.0" y1="266.0" x2="462.0" y2="284.0" stroke="#475569" stroke-width="1.3"/>
<path d="M 462.0,284.0 L 458.5,277.9 L 465.5,277.9 Z" fill="#475569"/>
<text x="30.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="bold">3. reverse the rest  →  [5, 6, 7, 1, 2, 3, 4]  done</text>
<rect x="60.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="86.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">5</text>
<rect x="116.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="142.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">6</text>
<rect x="172.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="198.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">7</text>
<rect x="228.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.3"/>
<text x="254.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">1</text>
<rect x="284.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.3"/>
<text x="310.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">2</text>
<rect x="340.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.3"/>
<text x="366.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">3</text>
<rect x="396.0" y="296.0" width="52.0" height="38.0" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.3"/>
<text x="422.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">4</text>
<rect x="470.0" y="84.0" width="280.0" height="250.0" rx="6" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
<text x="486.0" y="104.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="bold">Python</text>
<text x="486.0" y="126.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="start" font-weight="normal">def rotate(a, k):</text>
<text x="486.0" y="144.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="start" font-weight="normal">    k %= len(a)          # k may be &gt; n</text>
<text x="486.0" y="162.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="start" font-weight="normal">    a.reverse()</text>
<text x="486.0" y="180.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="start" font-weight="normal">    a[:k] = reversed(a[:k])</text>
<text x="486.0" y="198.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="start" font-weight="normal">    a[k:] = reversed(a[k:])</text>
<text x="486.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="bold">Alternative: slicing</text>
<text x="486.0" y="258.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#111827" text-anchor="start" font-weight="normal">a[:] = a[-k:] + a[:-k]</text>
<text x="486.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Left rotation is the mirror image: reverse the</text>
<text x="486.0" y="298.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">first k, then the rest, then everything.</text>
</svg>
