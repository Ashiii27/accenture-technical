<text x="46.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">• Stable = equal keys keep their original order (merge, insertion, bubble, counting are stable; quick, heap, selection are</text>
<text x="46.0" y="405.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">not).</text>
<text x="46.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">• Worst-case O(n log n) guarantees: merge sort and heap sort. Quick sort is O(n²) on already-sorted data with a first/last</text>
<text x="46.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">pivot — and it is the fastest in practice because of cache locality.</text>
