<svg xmlns="http://www.w3.org/2000/svg" width="790" height="522" viewBox="0 0 790 522" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="790" height="522" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="789" height="521" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">SQL — The Order You WRITE It vs the Order the Engine RUNS It</text>
<rect x="30.0" y="78.0" width="330.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="195.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">① How you WRITE the query</text>
<rect x="430.0" y="78.0" width="330.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="595.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">② How the engine EXECUTES it</text>
<rect x="30.0" y="108.0" width="330.0" height="38.0" rx="5" fill="#4f46e518" stroke="#4f46e5" stroke-width="1.2"/>
<text x="44.0" y="133.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">SELECT  name, COUNT(*) AS n</text>
<rect x="430.0" y="108.0" width="330.0" height="38.0" rx="5" fill="#0d948818" stroke="#0d9488" stroke-width="1.2"/>
<text x="444.0" y="133.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">FROM  employees</text>
<text x="392.0" y="133.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">1</text>
<rect x="30.0" y="150.0" width="330.0" height="38.0" rx="5" fill="#0d948818" stroke="#0d9488" stroke-width="1.2"/>
<text x="44.0" y="175.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">FROM  employees</text>
<rect x="430.0" y="150.0" width="330.0" height="38.0" rx="5" fill="#d9770618" stroke="#d97706" stroke-width="1.2"/>
<text x="444.0" y="175.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">WHERE  salary &gt; 40000</text>
<text x="392.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">2</text>
<rect x="30.0" y="192.0" width="330.0" height="38.0" rx="5" fill="#d9770618" stroke="#d97706" stroke-width="1.2"/>
<text x="44.0" y="217.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">WHERE  salary &gt; 40000</text>
<rect x="430.0" y="192.0" width="330.0" height="38.0" rx="5" fill="#7c3aed18" stroke="#7c3aed" stroke-width="1.2"/>
<text x="444.0" y="217.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">GROUP BY  dept_id</text>
<text x="392.0" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">3</text>
<rect x="30.0" y="234.0" width="330.0" height="38.0" rx="5" fill="#7c3aed18" stroke="#7c3aed" stroke-width="1.2"/>
<text x="44.0" y="259.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">GROUP BY  dept_id</text>
<rect x="430.0" y="234.0" width="330.0" height="38.0" rx="5" fill="#dc262618" stroke="#dc2626" stroke-width="1.2"/>
<text x="444.0" y="259.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">HAVING  COUNT(*) &gt; 1</text>
<text x="392.0" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">4</text>
<rect x="30.0" y="276.0" width="330.0" height="38.0" rx="5" fill="#dc262618" stroke="#dc2626" stroke-width="1.2"/>
<text x="44.0" y="301.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">HAVING  COUNT(*) &gt; 1</text>
<rect x="430.0" y="276.0" width="330.0" height="38.0" rx="5" fill="#4f46e518" stroke="#4f46e5" stroke-width="1.2"/>
<text x="444.0" y="301.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">SELECT  name, COUNT(*) AS n</text>
<text x="392.0" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">5</text>
<rect x="30.0" y="318.0" width="330.0" height="38.0" rx="5" fill="#16a34a18" stroke="#16a34a" stroke-width="1.2"/>
<text x="44.0" y="343.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">ORDER BY  n DESC</text>
<rect x="430.0" y="318.0" width="330.0" height="38.0" rx="5" fill="#16a34a18" stroke="#16a34a" stroke-width="1.2"/>
<text x="444.0" y="343.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">ORDER BY  n DESC</text>
<text x="392.0" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">6</text>
<rect x="30.0" y="360.0" width="330.0" height="38.0" rx="5" fill="#47556918" stroke="#475569" stroke-width="1.2"/>
<text x="44.0" y="385.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">LIMIT  5</text>
<rect x="430.0" y="360.0" width="330.0" height="38.0" rx="5" fill="#47556918" stroke="#475569" stroke-width="1.2"/>
<text x="444.0" y="385.0" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">LIMIT  5</text>
<text x="392.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">7</text>
<rect x="30.0" y="416.0" width="730.0" height="88.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="46.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="bold">Why this ordering matters in the exam</text>
<text x="46.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">• WHERE filters ROWS before grouping, so it cannot contain aggregates (COUNT/SUM/AVG) — that is what HAVING is for.</text>
<text x="46.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">• You can use a SELECT alias in ORDER BY (it runs later) but NOT in WHERE (it runs earlier) in standard SQL.</text>
<text x="46.0" y="494.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">• COUNT(*) counts rows; COUNT(col) counts non-NULL values; SUM of an empty set is NULL, COUNT of an empty set is 0.</text>
</svg>
