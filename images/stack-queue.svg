<text x="540.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0d9488" text-anchor="start" font-weight="bold">rear</text>
<line x1="458.0" y1="250.0" x2="458.0" y2="236.0" stroke="#0d9488" stroke-width="1.2"/>
<path d="M 458.0,236.0 L 461.0,241.2 L 455.0,241.2 Z" fill="#0d9488"/>
<text x="458.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" font-weight="normal">dequeue</text>
<line x1="600.0" y1="160.0" x2="616.0" y2="160.0" stroke="#0d9488" stroke-width="1.3"/>
<path d="M 616.0,160.0 L 610.8,163.0 L 610.8,157.0 Z" fill="#0d9488"/>
<text x="700.0" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="start" font-weight="normal">enqueue</text>
<text x="420.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Two ends: insert at the REAR, remove from the FRONT. Uses:</text>
<text x="420.0" y="314.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">printer queues, BFS, task scheduling, request buffering in</text>
<text x="420.0" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">web servers.</text>
<rect x="30.0" y="340.0" width="720.0" height="30.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="46.0" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">Trap: a stack implemented with an array must check for overflow/underflow; a naive queue wastes space — real ones are circular.</text>
</svg>
