<text x="105.0" y="148.6" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">push()</text>
<line x1="150.0" y1="145.0" x2="240.0" y2="145.0" stroke="#4f46e5" stroke-width="1.3"/>
<path d="M 240.0,145.0 L 234.8,148.0 L 234.8,142.0 Z" fill="#4f46e5"/>
<rect x="60.0" y="170.0" width="90.0" height="30.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="105.0" y="188.6" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">pop()</text>
<line x1="240.0" y1="185.0" x2="150.0" y2="185.0" stroke="#4f46e5" stroke-width="1.3"/>
<path d="M 150.0,185.0 L 155.2,182.0 L 155.2,188.0 Z" fill="#4f46e5"/>
<text x="60.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">One opening: both push and pop happen at the TOP.</text>
<text x="60.0" y="314.2" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">Uses: undo/redo, function call stack, expression</text>
<text x="60.0" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal">evaluation, browser back button.</text>
<rect x="400.0" y="78.0" width="350.0" height="250.0" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.4"/>
<text x="575.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="bold">QUEUE — First In, First Out</text>
<rect x="430.0" y="190.0" width="56.0" height="38.0" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
