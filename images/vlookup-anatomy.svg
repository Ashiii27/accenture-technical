<text x="400.0" y="216.0" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="bold">range_lookup</text>
<text x="30.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4f46e5" text-anchor="start" font-weight="normal">•</text>
<text x="46.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">lookup_value: What you are looking for (102)</text>
<text x="30.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0d9488" text-anchor="start" font-weight="normal">•</text>
<text x="46.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">table_array: Whole table; the key MUST be the LEFTMOST column</text>
<text x="30.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="normal">•</text>
<text x="46.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">col_index_num: Which column to return (3 = Salary)</text>
<text x="30.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="normal">•</text>
<text x="46.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">range_lookup: FALSE = exact • TRUE/omitted = approximate</text>
<rect x="30.0" y="400.0" width="710.0" height="122.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="46.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold">Traps that cost marks</text>
<text x="46.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">1. TRUE (or omitted) needs the first column sorted ASCENDING — otherwise you silently get a wrong row, not an error.</text>
<text x="46.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">2. col_index counts from the left edge of table_array, NOT from column A.</text>
<text x="46.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">3. VLOOKUP cannot look LEFT — use INDEX + MATCH for that.</text>
<text x="46.0" y="498.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">4. Wrap it: =IFERROR(VLOOKUP(...), "Not Found") turns #N/A into something readable.</text>
</svg>
